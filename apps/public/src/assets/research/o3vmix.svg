<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Pretendard, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <!-- Schematic: ozone kept overnight in the residual layer is mixed down to the surface as the morning boundary layer grows; a 1-D column model resolves the vertical. -->
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16213f"/><stop offset="1" stop-color="#2d3f6e"/></linearGradient>
    <linearGradient id="day" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fd3f2"/><stop offset="1" stop-color="#f6ecd2"/></linearGradient>
    <marker id="down" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c2561b"/></marker>
  </defs>
  <rect width="400" height="600" fill="url(#night)"/>
  <rect x="400" width="400" height="600" fill="url(#day)"/>
  <!-- moon and sun -->
  <circle cx="70" cy="70" r="26" fill="#f3f0dc"/><circle cx="82" cy="62" r="24" fill="#16213f"/>
  <circle cx="730" cy="72" r="30" fill="#ffd166"/>
  <text x="120" y="82" fill="#e9eefc" font-size="34" font-weight="700">Night</text>
  <text x="680" y="82" fill="#1f2a3a" font-size="34" font-weight="700" text-anchor="end">Morning</text>
  <!-- night: ozone held aloft in the residual layer, a thin stable layer at the ground -->
  <rect x="0" y="250" width="400" height="160" fill="#f2a65a" opacity=".32"/>
  <text x="24" y="238" fill="#ffd9b0" font-size="30" font-weight="600">O₃ kept aloft</text>
  <rect x="0" y="470" width="400" height="50" fill="#5d6fa3" opacity=".55"/>
  <!-- morning: the boundary layer has grown and the ozone is mixed through it -->
  <rect x="400" y="250" width="400" height="270" fill="#f2a65a" opacity=".3"/>
  <path d="M400 470 C 520 466, 600 330, 800 250" fill="none" stroke="#1f2a3a" stroke-width="3" stroke-dasharray="10 8"/>
  <g stroke="#c2561b" stroke-width="7" stroke-linecap="round" marker-end="url(#down)">
    <path d="M560 300 V 440"/><path d="M660 280 V 450"/><path d="M750 270 V 455"/>
  </g>
  <text x="776" y="238" fill="#7a3510" font-size="30" font-weight="600" text-anchor="end">mixed down</text>
  <!-- ozone molecules -->
  <g fill="#e8712a">
    <circle cx="60" cy="300" r="8"/><circle cx="130" cy="350" r="8"/><circle cx="200" cy="290" r="8"/><circle cx="270" cy="370" r="8"/><circle cx="330" cy="310" r="8"/>
    <circle cx="90" cy="390" r="8"/><circle cx="240" cy="330" r="8"/>
    <circle cx="470" cy="300" r="8"/><circle cx="520" cy="470" r="8"/><circle cx="610" cy="380" r="8"/><circle cx="700" cy="490" r="8"/><circle cx="620" cy="495" r="8"/><circle cx="480" cy="410" r="8"/><circle cx="770" cy="380" r="8"/>
  </g>
  <!-- the 1-D column: stacked model layers across the middle -->
  <g fill="#ffffff" fill-opacity=".9" stroke="#1f2a3a" stroke-width="1.5">
    <rect x="378" y="130" width="44" height="18"/><rect x="378" y="148" width="44" height="18"/><rect x="378" y="166" width="44" height="18"/><rect x="378" y="184" width="44" height="18"/><rect x="378" y="202" width="44" height="18"/>
    <rect x="378" y="220" width="44" height="20"/><rect x="378" y="240" width="44" height="20"/><rect x="378" y="260" width="44" height="20"/><rect x="378" y="280" width="44" height="20"/><rect x="378" y="300" width="44" height="20"/>
    <rect x="378" y="320" width="44" height="20"/><rect x="378" y="340" width="44" height="20"/><rect x="378" y="360" width="44" height="20"/><rect x="378" y="380" width="44" height="20"/><rect x="378" y="400" width="44" height="20"/>
    <rect x="378" y="420" width="44" height="20"/><rect x="378" y="440" width="44" height="20"/><rect x="378" y="460" width="44" height="20"/><rect x="378" y="480" width="44" height="20"/><rect x="378" y="500" width="44" height="20"/>
  </g>
  <rect x="300" y="88" width="200" height="38" rx="19" fill="#ffffff"/>
  <text x="400" y="116" fill="#1f2a3a" font-size="26" font-weight="700" text-anchor="middle">1-D column</text>
  <!-- ground and city -->
  <rect y="520" width="800" height="80" fill="#55624a"/>
  <g fill="#2f3646">
    <rect x="40" y="488" width="40" height="32"/><rect x="90" y="470" width="30" height="50"/><rect x="250" y="480" width="44" height="40"/><rect x="300" y="460" width="26" height="60"/>
    <rect x="470" y="485" width="40" height="35"/><rect x="520" y="465" width="28" height="55"/><rect x="680" y="478" width="46" height="42"/><rect x="734" y="458" width="28" height="62"/>
  </g>
</svg>
